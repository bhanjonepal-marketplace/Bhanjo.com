<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23FF5722'/><path d='M25 70 L50 25 L75 70 Z' fill='%23FFFFFF'/><path d='M38 70 L50 48 L62 70 Z' fill='%230F172A'/><circle cx='50' cy='35' r='5' fill='%23F59E0B'/></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Bhanjo.com | Nepal's Premier Online Shopping Platform</title>
  <meta name="description"
    content="Shop online at Bhanjo.com for authentic Himalayan specialties, trending electronics, fashion, and global direct imports. Enjoy nationwide doorstep delivery and Cash on Delivery (COD) across Nepal." />
  <!-- PWA Manifest & Mobile Web App Meta -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#F85606" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Bhanjo" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
</head>

<body class="bg-gray-50 text-slate-800 antialiased selection:bg-orange-500 selection:text-white">
  <div id="root"></div>
  <script>
    // PWA Service Worker: only active in production to prevent caching Vite HMR modules and assets
    if ('serviceWorker' in navigator) {
      const isDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname.startsWith('192.168.');
      if (isDev) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
        if ('caches' in window) {
          caches.keys().then(names => {
            for (let name of names) caches.delete(name);
          });
        }
      } else {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('✅ Bhanjo PWA ServiceWorker Registered:', reg.scope),
            (err) => console.log('❌ Bhanjo PWA ServiceWorker Failed:', err)
          );
        });
      }
    }
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
